<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" role="img">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#070d1f"/><stop offset="100%" stop-color="#162a4a"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
    <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="white" opacity="0.07"/>
  </pattern>
</defs>
<rect width="1280" height="400" rx="20" fill="url(#bg)"/>
<rect width="1280" height="400" rx="20" fill="url(#grid)"/>
<!-- animated scan line -->
<rect x="-400" y="0" width="400" height="400" fill="url(#line)" opacity="0.6">
  <animate attributeName="x" from="-400" to="1280" dur="4s" repeatCount="indefinite"/>
</rect>
<!-- subtle wavy path with dash animation -->
<path d="M -20 300 C 200 260, 380 340, 600 280 S 1000 180, 1300 220" stroke="#2dd4bf" stroke-width="1.5" fill="none" opacity="0.22" stroke-dasharray="8 12">
  <animate attributeName="stroke-dashoffset" from="0" to="40" dur="3s" repeatCount="indefinite"/>
</path>
<!-- left tag -->
<rect x="48" y="32" width="214" height="28" rx="14" fill="#1e3a5f" stroke="#2dd4bf" stroke-opacity="0.5"/>
<text x="155" y="50" text-anchor="middle" fill="#5eead4" font-family="monospace" font-size="12" font-weight="700" letter-spacing="1">INFORMATICS GUNADARMA</text>
<!-- main title with typing cursor -->
<text x="48" y="120" fill="white" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="800" letter-spacing="-2">Gopyr</text>
<rect x="268" y="88" width="14" height="42" rx="2" fill="#2dd4bf" opacity="0.9">
  <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
</rect>
<text x="48" y="162" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Naufal Brilyant Santoso</text>
<text x="48" y="192" fill="#94a3b8" font-family="monospace" font-size="13">mostly breaking things, then fixing them</text>
<text x="48" y="216" fill="#64748b" font-family="monospace" font-size="12">Web . Android . Automation . Performance</text>
<!-- right terminal card -->
<rect x="740" y="48" width="492" height="304" rx="16" fill="#0f172a" stroke="#1e293b"/>
<rect x="740" y="48" width="492" height="36" rx="16" fill="#1e293b"/>
<rect x="740" y="66" width="492" height="18" fill="#1e293b"/>
<circle cx="768" cy="66" r="6" fill="#ef4444"/><circle cx="788" cy="66" r="6" fill="#eab308"/><circle cx="808" cy="66" r="6" fill="#22c55e"/>
<text x="830" y="70" fill="#94a3b8" font-family="monospace" font-size="11">gopyr@lab : ~/gp-1</text>
<!-- code lines with subtle appear -->
<text x="760" y="108" fill="#5eead4" font-family="monospace" font-size="11">$ cat report.json | labboard</text>
<text x="760" y="128" fill="#7dd3fc" font-family="monospace" font-size="11">  p95 476ms . 4,605 req . 287 MiB . 0 failed</text>
<text x="760" y="152" fill="#5eead4" font-family="monospace" font-size="11">$ ./gradlew :vclass-sync:test</text>
<text x="760" y="172" fill="#86efac" font-family="monospace" font-size="11">  7 tests passed</text>
<text x="760" y="196" fill="#5eead4" font-family="monospace" font-size="11">$ tracelens --target :3000</text>
<text x="760" y="216" fill="#86efac" font-family="monospace" font-size="11">  proxy :3888 . capture on</text>
<!-- live spark bar -->
<g transform="translate(760,240)">
  <rect x="0" y="0" width="42" height="24" rx="6" fill="#1e293b"/>
  <rect x="6" y="14" width="4" height="6" rx="2" fill="#2dd4bf"><animate attributeName="height" values="6;16;8;12;6" dur="2s" repeatCount="indefinite"/></rect>
  <rect x="12" y="10" width="4" height="10" rx="2" fill="#2dd4bf"><animate attributeName="height" values="10;6;14;7;10" dur="2s" repeatCount="indefinite"/></rect>
  <rect x="18" y="8" width="4" height="12" rx="2" fill="#2dd4bf"><animate attributeName="height" values="12;9;6;15;12" dur="2s" repeatCount="indefinite"/></rect>
  <rect x="24" y="12" width="4" height="8" rx="2" fill="#2dd4bf"><animate attributeName="height" values="8;13;10;6;8" dur="2s" repeatCount="indefinite"/></rect>
  <text x="52" y="16" fill="#94a3b8" font-family="monospace" font-size="10">live telemetry</text>
</g>
<!-- bottom accent -->
<rect x="0" y="396" width="1280" height="4" rx="2" fill="#2dd4bf"/>
</svg>