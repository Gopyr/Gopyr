name: Shuffle Banner GIF
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shuffle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick random banner
        id: pick
        run: |
          BANNERS=(
          'assets/itachi-banner.gif' \
          'assets/banner-madara.gif' \
          'assets/banner-akatsuki.gif' \
          'assets/banner-itachi-crow.gif' \
          'assets/banner-itachi-crows2.gif' \
          'assets/banner-itachi-crows3.gif' \
          'assets/banner-luffy-gear5.gif' \
          'assets/banner-zoro.gif' \
          'assets/banner-goku-ui.gif' \
          'assets/banner-rengoku.gif' \
          )
          N=$((RANDOM % ${#BANNERS[@]}))
          echo "banner=${BANNERS[$N]}" >> $GITHUB_OUTPUT
      - name: Update README
        run: |
          python3 - <<'EOF'
          import re, pathlib
          p = pathlib.Path("README.md")
          s = p.read_text()
          s = re.sub(r'<img src="\./assets/(?:banner|itachi)[^"]*\.gif"', '<img src="./${ steps.pick.outputs.banner }"', s)
          p.write_text(s)
          EOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "shuffle: ganti banner [skip ci]"
          git push
