name: Generate Snake
on:
  schedule:
    - cron: "0 0 * * *"   # tiap hari tengah malam UTC
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Gopyr
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - name: Move SVG
        run: mkdir -p out && cp dist/github-contribution-grid-snake-dark.svg out/
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
